name: Ubuntu backend compatibility validation

# Dedicated, disposable test VMs with passwordless sudo are required.
# This is an opt-in workflow; no hosted-runner kernel compatibility is assumed.
# Module-free runners must already have integrity lockdown and module loading
# disabled. This workflow does not change boot or kernel policy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.backend }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"backend": "root", "target": "ubuntu22-arm64", "prefix": "", "artifact": "ubuntu22-arm64", "labels": ["self-hosted", "Linux", "ARM64", "pidfd-ubuntu22"]}
          - {"backend": "root", "target": "ubuntu24-x86_64", "prefix": "", "artifact": "ubuntu24-x86_64", "labels": ["self-hosted", "Linux", "X64", "pidfd-ubuntu24"]}
          - {"backend": "root", "target": "ubuntu26-x86_64", "prefix": "", "artifact": "ubuntu26-x86_64", "labels": ["self-hosted", "Linux", "X64", "pidfd-ubuntu26"]}
          - {"backend": "module-free", "target": "ubuntu22-arm64", "prefix": "module-free/", "artifact": "module-free-ubuntu22-arm64", "labels": ["self-hosted", "Linux", "ARM64", "pidfd-module-free-ubuntu22"]}
          - {"backend": "module-free", "target": "ubuntu24-x86_64", "prefix": "module-free/", "artifact": "module-free-ubuntu24-x86_64", "labels": ["self-hosted", "Linux", "X64", "pidfd-module-free-ubuntu24"]}
          - {"backend": "module-free", "target": "ubuntu26-x86_64", "prefix": "module-free/", "artifact": "module-free-ubuntu26-x86_64", "labels": ["self-hosted", "Linux", "X64", "pidfd-module-free-ubuntu26"]}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install target dependencies
        run: sudo ./${{ matrix.prefix }}install-ubuntu.sh
      - name: Check target and run functional validation
        if: matrix.backend == 'root'
        run: |
          sudo ./run.sh doctor
          sudo ./run.sh validate
      - name: Run lifecycle, callback and helper-authority controls
        if: matrix.backend == 'root'
        run: |
          sudo python3 tests/kfunc_registration_guest.py
          sudo python3 python/collector_path_scope_guest.py tests/source_binding_guest.py --backend root
          sudo python3 python/collector_path_scope_guest.py tests/leader_exit_guest.py --backend root
          sudo python3 tests/kernel_ordering_guest.py --backend root --report evidence/kernel-ordering.json
      - name: Require the configured module-free test policy
        if: matrix.backend == 'module-free'
        run: |
          test "$(cat /proc/sys/kernel/modules_disabled)" = 1
          sudo python3 -c "from pathlib import Path; import sys; sys.exit(0 if '[integrity]' in Path('/sys/kernel/security/lockdown').read_text() else 1)"
      - name: Validate without module-loading capability
        if: matrix.backend == 'module-free'
        run: sudo setpriv --bounding-set=-sys_module --inh-caps=-sys_module --ambient-caps=-sys_module ./module-free/run.sh validate
      - name: Run lifecycle, callback and loader-failure controls
        if: matrix.backend == 'module-free'
        run: |
          sudo setpriv --bounding-set=-sys_module --inh-caps=-sys_module --ambient-caps=-sys_module python3 tests/source_binding_guest.py --backend module-free
          sudo setpriv --bounding-set=-sys_module --inh-caps=-sys_module --ambient-caps=-sys_module python3 tests/leader_exit_guest.py --backend module-free
          sudo setpriv --bounding-set=-sys_module --inh-caps=-sys_module --ambient-caps=-sys_module python3 tests/fixture_failures_guest.py
          sudo setpriv --bounding-set=-sys_module --inh-caps=-sys_module --ambient-caps=-sys_module python3 tests/kernel_ordering_guest.py --backend module-free --report module-free/evidence/kernel-ordering.json
      - name: Retain reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.prefix }}evidence/**/*.json
            ${{ matrix.prefix }}evidence/**/*.log
          if-no-files-found: warn
