name: Owned endpoint guest validation

# Dedicated disposable VMs, empty /opt/iosec-endpoint and no fleet config.
# None/voluntary preemption and the documented privileges are prerequisites.
# This workflow never changes lockdown, boot arguments or module policy.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu22-arm64
            labels: '["self-hosted", "Linux", "ARM64", "pidfd-endpoint-ubuntu22"]'
          - target: ubuntu24-x86_64
            labels: '["self-hosted", "Linux", "X64", "pidfd-endpoint-ubuntu24"]'
          - target: ubuntu26-x86_64
            labels: '["self-hosted", "Linux", "X64", "pidfd-endpoint-ubuntu26"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: sudo ./endpoint-service/install-ubuntu.sh
      - name: Preflight and build upstream-only endpoint
        run: |
          sudo ./endpoint-service/run.sh doctor
          sudo ./endpoint-service/run.sh build
      - name: Run real collector and private restart-policy controls
        run: |
          sudo python3 tests/ownership_drift_guest.py --report endpoint-service/evidence/ownership-drift.json
          sudo python3 endpoint-service/tests/check_storage.py
          sudo python3 endpoint-service/tests/descriptor_alias_guest.py
          sudo cp endpoint-service/evidence/descriptor-alias.json endpoint-service/evidence/descriptor-alias-identity.json
          sudo python3 endpoint-service/tests/descriptor_alias_guest.py --capture-python
          sudo cp endpoint-service/evidence/descriptor-alias.json endpoint-service/evidence/descriptor-alias-source.json
          sudo python3 endpoint-service/tests/integration_guest.py
          sudo python3 endpoint-service/tests/startup_guest.py
      - name: Exercise installation and shipped systemd unit
        run: sudo python3 endpoint-service/tests/systemd_guest.py
      - name: Retain current reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endpoint-${{ matrix.target }}
          path: |
            endpoint-service/evidence/**/*.json
            endpoint-service/evidence/**/*.log
          if-no-files-found: warn
