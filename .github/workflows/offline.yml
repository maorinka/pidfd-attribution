name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install black==24.2.0 clang-format==18.1.3
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python endpoint-service/tests/test_service.py
      - run: python tools/check_style.py
      - run: |
          gcc -std=c11 -Wall -Wextra -Werror endpoint-service/tests/capture_controller.c -o /tmp/capture-controller
          /tmp/capture-controller
