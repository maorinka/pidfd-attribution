name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install black==24.2.0 clang-format==18.1.3
      - name: Install development imports and discover tests in isolated Python
        run: |
          python -m pip install --no-deps -e .
          python -I -m unittest discover -s tests
      - run: python -I tools/run_tests.py --suite endpoint
      - run: python tools/check_style.py
      - name: Test a portable source export without symlinks or Git metadata
        shell: bash
        run: |
          python tools/export_source.py --output /tmp/pidfd-source.tar.gz
          source_directory=$(mktemp -d)
          tar -xzf /tmp/pidfd-source.tar.gz -C "$source_directory"
          cd "$source_directory/pidfd-attribution"
          python -I tools/run_tests.py --suite root
          python -I tools/run_tests.py --suite endpoint
      - run: python tools/index_evidence.py --output /tmp/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-index-${{ matrix.python }}
          path: /tmp/evidence-index.json
      - run: |
          gcc -std=c11 -Wall -Wextra -Werror endpoint-service/tests/capture_controller.c -o /tmp/capture-controller
          /tmp/capture-controller
          gcc -std=gnu11 -Wall -Wextra -Werror tests/fixture_child.c -o /tmp/fixture-child
          /tmp/fixture-child
  storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libbpf-dev libelf-dev zlib1g-dev
      - name: Compile and exercise the collector without BPF attachment
        run: |
          storage_inputs=$(mktemp -d /tmp/pidfd-storage-inputs-XXXXXX)
          storage_reports=$(mktemp -d /tmp/pidfd-storage-reports-XXXXXX)
          cat > "$storage_inputs/python_layout.h" <<'HEADER'
          #define PIDFD_PYTHON_BINARY "/usr/bin/python3.12"
          HEADER
          python3 -B endpoint-service/tests/check_storage.py --build-dir "$storage_inputs" --report-dir "$storage_reports"
          gcc -O2 -Wall -Wextra -Werror endpoint-service/benchmarks/bpf_runtime.c -lbpf -lelf -lz -o /tmp/bpf-runtime
  compilation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install compiler and sample headers
        run: sudo apt-get update && sudo apt-get install -y clang llvm gcc linux-tools-generic linux-headers-generic python3-dev libbpf-dev libelf-dev zlib1g-dev pkg-config binutils pahole
      - name: Reject malformed unloaded endpoint control maps
        env:
          PIDFD_REQUIRE_CONTROL_MAP_TEST: '1'
          PIDFD_BPF_CLANG: /usr/bin/clang
        run: /usr/bin/python3 -m unittest tests.test_control_maps -v
      - name: Compile all readers, collectors and module without loading them
        shell: bash
        run: |
          compile_headers=(/usr/src/linux-headers-*-generic)
          /usr/bin/python3 tools/check_compilation.py --kernel-headers "${compile_headers[-1]}" --report /tmp/compilation.json
      - name: Retain compile-only report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-only
          path: /tmp/compilation.json
          if-no-files-found: warn
